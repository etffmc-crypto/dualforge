name: release

# Push a tag v<package.json version> on main (see README "Release process") and this builds the NSIS installer on
# Windows and publishes a GitHub release with the installer, its blockmap, latest.yml (read by the in-app updater)
# and SHA256SUMS.txt (shown on the download page). Re-run for an existing tag with "Run workflow".
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v0.3.3
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag must equal v<package.json version>
        run: node scripts/release.mjs verify-tag "$env:TAG"
      - name: Version without the v
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$($env:TAG.Substring(1))"
      - run: npm ci
      - name: Electron binary (npm 11 skips install scripts)
        run: node node_modules/electron/install.js
      - name: Build the sendinput addon
        working-directory: native/sendinput
        run: npx node-gyp rebuild
      - name: Rebuild native modules for Electron (writes the ABI marker)
        run: npm run rebuild -w @dualforge/desktop
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Build the installer (never publishes by itself)
        run: npm run dist:installer -- --publish never
      - name: Release notes from CHANGELOG.md
        run: node scripts/release.mjs notes "$env:TAG" release-notes.md
      - name: SHA256SUMS.txt
        run: node scripts/release.mjs sums apps/desktop/release apps/desktop/release/SHA256SUMS.txt
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: DualForge ${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ contains(env.VERSION, '-') }}
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/DualForge-Setup-${{ env.VERSION }}.exe
            apps/desktop/release/DualForge-Setup-${{ env.VERSION }}.exe.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/SHA256SUMS.txt
