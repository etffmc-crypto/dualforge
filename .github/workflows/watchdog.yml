name: watchdog

# Every 30 minutes: download page up, latest release consistent (installer bytes verified once per new or re-uploaded
# asset), check.yml green on main. Failures open/update/reopen one `watchdog` issue per check; it closes itself when the
# check passes again. The job stays green when it filed issues; it fails only when the watchdog itself broke.
# Note: GitHub disables scheduled workflows after 60 days without repository activity (re-enable under Actions).
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  actions: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # which installer asset was last verified, so the ~110 MB download only happens for a new or changed asset
      - name: Restore watchdog state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog
          key: watchdog-state-${{ github.run_id }}
          restore-keys: watchdog-state-
      - name: Run checks
        id: run
        run: node scripts/watchdog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHDOG_STATE: .watchdog/state.json
      - name: Save watchdog state (only when it changed)
        if: steps.run.outputs.state_changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog
          key: watchdog-state-${{ github.run_id }}
